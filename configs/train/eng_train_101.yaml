chunks_dir: ../../data/eng_101
architecture: fcn_ocr
architecture_params: {}

epochs: 50
batch_size: 1024
batch_count: 100
lr: 0.001
optimizer: adam
weight_decay: 0.0
scheduler: reduce_on_plateau
scheduler_factor: 0.5
scheduler_patience: 3
scheduler_min_lr: 0.000001
scheduler_threshold: 0.0001
scheduler_cooldown: 0
checkpoint_dir: ../../checkpoints
max_train_batches: null
max_val_batches: 50
val_fraction: 0.1
seed: 42
resume: false

loss_mode: fcn_ocr
ocr_crop_left: 6
ocr_crop_right: 5
ocr_target_min_majority: 0.6
ocr_space_weight: 0.5

num_workers: 0
drop_last: false
prefetch_factor: 2
persistent_workers: true
chunk_cache_size: 2
chunk_aware_batches: true

log_every: 1
preview_samples: 5
preview_dir: ../../output

gpu_augmentations: true
gpu_augment_val: false
augmentation_probabilities:
  cycle_shift: 0.08
  preprocess_geometry: 0.35
  strong_blur: 0.18
  motion_blur: 0.28
  scale: 0.22
  darkening: 0.55
  vertical_fade: 0.30
  noise: 0.85
  projective: 0.12
  rotate: 0.30
  x_pad: 0.50
  crop_x: 0.45
  crop_y: 0.04
  random_line: 0.22
  baseline_line: 0.10
  morphology: 0.18
  unsharp_mask: 0.3
  brightness: 0.4
  contrast: 0.45
  invert: 0.0
augmentations:
  cycle_shift:
    max_x: 8
    max_y: 2
  preprocess_geometry:
    scale_x_min: -0.18
    scale_x_max: 0.18
    y_pad_min: -0.08
    y_pad_max: 0.08
    fillcolor: 255
  strong_blur:
    radius_min: 0.8
    radius_max: 1.8
  motion_blur:
    size_min: 3
    size_max: 8
    angle_min: -10.0
    angle_max: 10.0
  scale:
    factor_x_min: 0.8
    factor_x_max: 1.15
    factor_y_min: 0.92
    factor_y_max: 1.08
    fillcolor: 255
  darkening:
    factor_min: 0.35
    factor_max: 1.0
  vertical_fade:
    side: random
    extent_min: 0.20
    extent_max: 0.55
    strength_min: 0.15
    strength_max: 0.65
    gamma_min: 0.7
    gamma_max: 1.8
  noise:
    kind: gaussian
    std_min: 1.5
    std_max: 12.0
  projective:
    max_dx: 4.0
    max_dy: 1.5
    fillcolor: 255
  rotate:
    max_degrees: 2.0
    fillcolor: 255
  x_pad:
    pad_min: 0.03
    pad_max: 0.25
    pad_reference: content
    fill_mode: side_median
    resize_mode: bilinear
  crop_x:
    max_left: 6
    max_right: 6
    fillcolor: 255
  crop_y:
    max_top: 1
    max_bottom: 1
    fillcolor: 255
  random_line:
    angle_degrees_min: -4.0
    angle_degrees_max: 4.0
    line_width_min: 1.0
    line_width_max: 2.5
    alpha_min: 0.35
    alpha_max: 0.9
    value_min: 0.0
    value_max: 80.0
    y_min: 0.15
    y_max: 0.9
  baseline_line:
    side: random_or_both
    both_probability: 0.35
    top_y_min: 0.18
    top_y_max: 0.36
    bottom_y_min: 0.62
    bottom_y_max: 0.88
    angle_degrees_min: -2.5
    angle_degrees_max: 2.5
    line_width_min: 0.75
    line_width_max: 2.0
    alpha_min: 0.25
    alpha_max: 0.75
    value_min: 0.0
    value_max: 90.0
  morphology:
    operation: random
    size: 3
  unsharp_mask:
    radius: 1.2
    percent_min: 100
    percent_max: 220
    threshold: 3
  brightness:
    factor_min: 0.75
    factor_max: 1.25
  contrast:
    factor_min: 0.75
    factor_max: 1.4
  invert: {}
