json: ../../output/manual_markup.json
images: null
checkpoint: ../../checkpoints/cut_segmentator/best_model.pth
inference_ocr_checkpoint: null
out: ../../output/segmentator_metrics.csv
device: cuda
batch_size: 64
limit: null
log_every: 100
cut_tolerance_px: 3.0

baseline_detector_checkpoint: ../../checkpoints/baseline_detector/best_model.pth

parameters:
  cut_threshold: [0.10, 0.95]
  cut_min_width: [1, 10]
  cut_max_width: [0, 32]
  cut_smooth_radius: [0, 3]
  scale_x: [-0.20, 0.20]
  y_pad: [-0.20, 0.20]
  x_pad: [0.0, 0.08]
  baseline_crop: true
  baseline_strict_lines: true
  baseline_line_pad: 0.08
  baseline_line_pad_px: 0.0
  baseline_deskew: true
  baseline_max_angle: 12.0
  baseline_detector_threshold: 0.35

optuna_trials: 300
optuna_metric: cut_f1

optuna_trials_out: ../../output/segmentator_trials.tsv
optuna_storage: sqlite:///../../output/segmentator_v2.db
optuna_study_name: eng_101_segmentator_v2
optuna_progress: true
