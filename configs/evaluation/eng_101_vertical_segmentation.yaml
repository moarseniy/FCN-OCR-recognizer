json: ../../output/manual_markup.json
images: null
checkpoint: ../../checkpoints/vertical_segmentation/best_model.pth
out: ../../output/vertical_segmentation_metrics.csv
device: cuda
batch_size: 64
limit: null
log_every: 100
cut_tolerance_px: 3.0

baseline_detector_checkpoint: ../../checkpoints/baseline_detection/best_model.pth

parameters:
  cut_threshold: [0.10, 0.95]
  cut_min_width: [1, 10]
  cut_max_width: [0, 32]
  cut_smooth_radius: [0, 3]
  scale_x: [-0.20, 0.20]
  y_pad: [-0.20, 0.20]
  x_pad: [0.0, 0.08]
  baseline_crop: true
  baseline_line_pad: 0.08
  baseline_line_pad_px: 0.0
  baseline_deskew: true
  baseline_max_angle: 12.0
  baseline_detector_threshold: 0.35

optuna_trials: 300
optuna_metric: cut_f1

optuna_trials_out: ../../output/vertical_segmentation_trials.tsv
optuna_storage: sqlite:///../../output/vertical_segmentation_v3.db
optuna_study_name: eng_101_vertical_segmentation_v3
optuna_progress: true
optuna_seed: 0
optuna_image_cache_mb: 512
optuna_cache_neural_outputs: true
