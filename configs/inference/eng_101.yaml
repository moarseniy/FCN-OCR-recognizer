# Paths are resolved relative to this file.
device: cuda

baseline:
  enabled: true
  detector_checkpoint: ../../checkpoints/baseline_detector/best_model.pth
  detector_threshold: 0.35
  deskew: true
  max_angle: 12.0
  strict_lines: true
  line_pad: 0.08
  line_pad_px: 0.0

ocr:
  checkpoint: ../../checkpoints/eng_101/best_model.pth
  preprocessing:
    scale_x: 0.0
    y_pad: 0.4
    x_pad: 0.03
  decode:
    enabled: true
    method: dp
    top_k: 8
    center_fraction: 0.6
    min_score_width: 1
    cut_weight: 1.0
    ocr_weight: 1.0
    width_weight: 0.05
    skip_cut_penalty: 0.35
    glyph_width_prior:
      enabled: true
      weight: 0.08
      normalize_by: median_cell_width
      ranges:
        " ": [0.70, 3.00]
        "0123456789": [0.65, 1.35]
        "~": [0.55, 1.60]

segmentator:
  checkpoint: ../../checkpoints/cut_segmentator/best_model.pth
  preprocessing:
    scale_x: 0.0
    y_pad: 0.0
    x_pad: 0.03
  cut_threshold: null
  cut_min_width: null
  cut_max_width: null
  cut_smooth_radius: null

debug:
  top_k: 8
