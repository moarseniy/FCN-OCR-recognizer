task: fcn_ocr
alphabet: " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
space_char: " "
samples: 100000
output_dir: ../../data
chunk_size: 1024
num_workers: 4
overwrite: false
image_height: 48
image_width: 256
word_count_min: 6
word_count_max: 18
word_length_min: 2
word_length_max: 8
crop_stride: 256
min_crop_text_length: 1
max_crop_text_length: 16
edge_char_min_visible_ratio: 0.75
edge_fragment_max_visible_ratio: 0.25
font_dir: ../fonts
font_extensions:
  - .ttf
  - .otf
  - .ttc
  - .otc
main_text_height_ratio_min: 0.50
main_text_height_ratio_max: 0.78
char_spacing_min: -0.4
char_spacing_max: 1.6
word_spacing_multiplier_min: 0.75
word_spacing_multiplier_max: 1.7
channels: 3
seed: 42
background_dir: null
background_extensions:
  - .png
  - .jpg
  - .jpeg
  - .bmp
  - .webp
horizontal_padding: 8
