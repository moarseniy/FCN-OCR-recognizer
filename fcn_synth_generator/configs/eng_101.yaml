alphabet: " -0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
space_char: " "
channels: 1
seed: 42
samples: 100000
output_dir: ../../data
chunk_size: 1024
num_workers: 4
overwrite: false

save_fcn_ocr_targets: true
save_vertical_segmentation_targets: false
save_baseline_detection_targets: false

image_height: 48
image_width: 64
min_text_length: 4
max_text_length: 16
line_crops: true
word_count_min: 6
word_count_max: 18
word_length_min: 2
word_length_max: 8
crop_stride: 64
min_crop_text_length: 1
edge_char_min_visible_ratio: 0.75
edge_fragment_max_visible_ratio: 0.25
neighbor_lines_probability: 0.0
neighbor_line_min_crop_ratio: 0.65
neighbor_line_visible_ratio_min: 0.06
neighbor_line_gap_min: 0
neighbor_line_gap_max: 5

font_dir: ../fonts
font_extensions:
  - .ttf
  - .otf
  - .ttc
  - .otc
font_size_min: 24
font_size_max: 34

char_spacing_min: -0.4
char_spacing_max: 1.6
ink_spacing_enabled: true
ink_spacing_min_char_gap_px: 0.0
ink_spacing_touch_gap_px: 0.5
ink_spacing_touch_probability: 0.15
word_spacing_multiplier_min: 0.75
word_spacing_multiplier_max: 1.7

background_dir: ../backgrounds
background_extensions:
  - .png
  - .jpg
  - .jpeg
  - .bmp
  - .webp
horizontal_padding: 8
