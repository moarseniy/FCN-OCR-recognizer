task: fcn_ocr
alphabet: " 0123456789"
space_char: " "
samples: 100000
output_dir: ../../data
chunk_size: 1024
num_workers: 4
overwrite: false
image_height: 48
image_width: 256
min_text_length: 4
max_text_length: 16
font_dir: ../fonts
font_extensions:
  - .ttf
  - .otf
  - .ttc
  - .otc
main_text_height_ratio_min: 0.50
main_text_height_ratio_max: 0.78
char_spacing_min: -0.4
char_spacing_max: 1.6
word_spacing_multiplier_min: 0.75
word_spacing_multiplier_max: 1.7
channels: 3
seed: 42
background_dir: ../backgrounds
background_extensions:
  - .png
  - .jpg
  - .jpeg
  - .bmp
  - .webp
horizontal_padding: 8
